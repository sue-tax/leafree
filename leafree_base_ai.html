// 描画の順番（重ね合わせ）:この直線コードを、通常のツリーのリンク（線）やノード（円・テキスト）の描画コードよりも前に書くか、後に書くかで重なり順が変わります。ノードの「後ろ」に通したい場合：ノード（<circle>など）を描画するコードより前に記述します。ノードの「手前」に重ねたい場合：ノードを描画するコードより後に記述します。


//ノード名が重複していないかをチェックする
// 兄弟間での重複だけがダメ
function checkNodeName(root) {
  // まずは単純に重複がなければ、ＯＫ
  const allNodes = root.descendants();
  const uniqueNames = new Set(allNodes.map(node => node.data.name));
  console.log(uniqueNames);
  const flagAllUnique = uniqueNames.size === allNodes.length;
  if (flagAllUnique) {
    return true;
  }
  // 重複があれば、兄弟間の重複がないかをチェックする。
  const flag = checkNodeNameBrother(root);
  function checkNodeNameBrother(nodeParent) {
    const nodes = nodeParent.children;
    if (nodes == null) { return true; }
    const newMap = nodes.map(node => node.data.name);
    console.log(newMap);
    // const uniqueNames = new Set(nodes.map(node => node.data.name));
    const uniqueNames = new Set(newMap);
    const flagUnique = uniqueNames.size === nodes.length;
    if (! flagUnique) {
      return false;
    }
    // nodes.forEach(node, i)
    if (nodes.find((node) => checkNodeNameBrother(node) === false)
        !== undefined) {
      return false;
    }
    return true;
  }
  return flag;
}


//ノードを探す
// startNode を起点として、targetNameのノードを探す
// どこの階層にもなければ null を返す
function findNodeFromHere(startNode, targetName) {
  // 全ノードを取得し、条件に合うものを全て抽出
  const allTargetNodes = root.descendants().
      filter(d => d.data.name === targetName);
  if (allTargetNodes.length === 0) {
    return null;
  }
  if (allTargetNodes.length === 1) {
    return allTargetNodes[0]; 
  }
  // 指定されたノードの「下位ノード（子孫）」を探す。子優先。
  var nodes = startNode.children;
  if (nodes !== undefined) {
    let found = nodes.find((node) => (node).data.name === targetName);
    if (found) return found;
  }
  // 下位になければ、ルート（最上位）に達するまで「上の階層」へ遡る
  let current = startNode;
  while (current.parent) {
    const parentNode = current.parent;
    // 親ノード自身が目的のノードかチェック
    if (parentNode.data.name === targetName) return parentNode;
    // 親ノードから見た「他の枝（兄弟ノードとその下位）」を探す
    // ※すでに探索済みの自分の枝（current）は除外して探すとより効率的です
    found = parentNode.children.
        find(d => d.data.name === targetName && d !== current);
    if (found) return found;
    // さらに上の親へ
    current = parentNode;
  }
  return null;
}


function getNodeValue(node) {
  if (node.data.value != null) {
    return node.data.value;
  }
  calcEachNode(node);
  return node.data.value;
}


//ノードの値を計算する
// ループエラーに注意
// load時は、disp,valueを全クリア後に、順番に呼び出す
function calcEachNode(node) {
  if (node.data.disp && node.data.disp !== null) { return; }  //タイミングによっては、あり
  var expr = node.data.expr;
  if (typeof expr !== "string" || ! expr.startsWith("=")) {
    node.data.value = expr;
    if (Number.isInteger(node.data.value)) {
      node.data.disp = formatComma(node.data.value);
    } else if (isNumber(node.data.value)) {
      node.data.disp = d3.format(",.2f")(node.data.value);
    } else {
      node.data.disp = node.data.value;
    }
    return;
  }

  var dst = "";
  var index = 1;
  const length = expr.length;
  while (index < length) {
    if (expr[index] === "'") {
      index += 1;
      // if (expr[index] === "'")
      var node_name = "";
      while (expr[index] !== "'") {
        node_name += expr[index];
        index += 1;
      }
      index += 1;
      const target_node = findNodeFromHere(node, node_name);
      if (target_node === null) {
        node.data.value = "#NAME?" + node_name + expr.substring(index);
        node.data.disp = node.data.value;
        return;
      }
      // console.log(node.link_src_set);
      // console.log(typeof node.link_src_set);
      node.link_src_set.add(target_node);
      target_node.link_ref_set.add(node);
      node.data.value = "#LOOP";
      const value = getNodeValue(target_node);
      if (typeof value === "string" && value.startsWith("#")) {
        node.data.value = value + "?" + node_name + expr.substring(index);
        node.data.disp = node.data.value;
        return;
      }
      dst += value;
    } else {
      dst += expr[index];
      index += 1;
    }
  }
  const result = math.evaluate(dst);
  node.data.value = result;
  if (Number.isInteger(node.data.value)) {
    node.data.disp = formatComma(node.data.value);
  } else if (isNumber(node.data.value)) {
    node.data.disp = d3.format(",.2f")(node.data.value);
  } else {
    node.data.disp = node.data.value;
  }
  return;
}

function clear_ref(node) {
  node.data.disp = null;
  node.data.value = null;
  if (node.link_ref_set.size !== 0) {
    root.descendants()
      .filter(d => node.link_ref_set.has(d))
      .forEach(d => clear_ref(d));
  }
  node.link_ref_set.clear();
  return;
}

function reexpr_node(d) {

    .node();
  saveReexprNode = d;
  inputExpr.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
          reexprText();
      }
  });
  function reexprText() {
    const expr = inputExpr.value.trim();
    const old_expr = saveReexprNode.data.expr;
    if (expr !== "") {
      if (old_expr === expr) {
        alert(`式は変わっていません。`);
        return;
      }
      inputExpr.remove();

      saveReexprNode.data.expr = expr;
      saveReexprNode.data.value = null;
      saveReexprNode.data.disp = null;

      // 以下のノードのvalueをクリアしてから、再計算
      // エラーノード
      // このノードを参照しているノード、さらにそのノードを参照しているノード
      root.descendants()
        .filter(d => d.data && (!d.data.value ||
             (typeof d.data.value === "string") && (d.data.value.startsWith("#"))))
        .forEach(d => {
          d.data.disp = null;
          d.data.value = null;
        });

      if (saveReexprNode.link_ref_set.size !== 0) {
        root.descendants()
          .filter(d => saveReexprNode.link_ref_set.has(d))
          .forEach(d => clear_ref(d));
      }
      root.descendants()
        .filter(d => d.data && (!d.data.value || d.data.value === null))
        .forEach(d => {
          calcEachNode(d);
        });

      console.log(root);

      update(root);
    } else {
      inputExpr.remove();
    }
  }
  inputExpr.focus();
  inputExpr.select();
  return;
}

    const name = inputName.value.trim();

      root.descendants()

             (typeof d.data.value === "string") && (d.data.value.startsWith("#"))))

      if (saveRenameNode.link_ref_set.size !== 0) {

          .filter(d => saveRenameNode.link_ref_set.has(d))
          .forEach(d => clear_ref(d));
      }

      const sameNodes = root.descendants()
        .filter(d => d.data && d.data.name && d.data.name == name)
        .forEach(d => clear_ref(d));

      root.descendants()
        .filter(d => d.data && (!d.data.value || d.data.value === null))

        });

      console.log(root);

    }

function delete_node(d) {
  const num_child = d.descendants().length - 1;
  if (num_child !== 0) {
    message = "子孫ノード " + num_child + " 個含めて削除する(OK)か、削除中止する(キャンセル)か";
    var result = confirm(message);
    if (! result) {
      return;
    }
  }
  if (!d.parent) {
    alert("ルートノードは削除できません。");
    return;
  }

  d.descendants()
    .forEach(child => clear_ref(child));

    // --- 1. 生データ (.data) の階層構造から削除 ---
  if (d.parent.data && d.parent.data.children) {
    var pIdx = d.parent.data.children.indexOf(d.data);
    if (pIdx > -1) {
      d.parent.data.children.splice(pIdx, 1);
    }
  }
  // --- 2. D3ノードデータ構造から削除 ---
  var index = d.parent.children.indexOf(d);
  if (index > -1) {
    d.parent.children.splice(index, 1);
  }
  // 子ノードが0個になったら配列をnullにする（D3の折りたたみ等の挙動に合わせる）
  if (d.parent.children.length === 0) {
    d.parent.children = null;
  }

  root.descendants()
    .filter(d => d.data && (!d.data.value || d.data.value === null))
    .forEach(d => {
      calcEachNode(d);
    });

  // --- 3. 画面の再描画 ---
  update(root);
}

function copy_node(d) {
  var jsonString = JSON.stringify(d.data, null, 2);
  console.log(jsonString);
// navigator.clipboard.writeText(jsonString).then(() => {
//   console.log("JSONをクリップボードにコピーしました");
// }).catch(err => {
//   console.error("コピーに失敗しました", err);
// });

  // 2. メモ帳やSlack、Excel等にきれいに貼り付けられるように「テキストツリー」にする
  var textLines = [];
  d.descendants().forEach(function(node) {
    // 自分の階層（depth）に応じてインデント（スペースやタブ）を付与する
    // ルートからの相対的な深さを計算（選択したノードを基準にする）
    var relativeDepth = node.depth - d.depth;
    var indent = "\t".repeat(relativeDepth); // スペース2つで表現（Excel用なら "\t".repeat() がおすすめ）
    
    // 表示名（お使いのデータ構造に合わせて name や label 等に変更してください）
    var nodeName = node.data.expr || "名称未設定";
    
    textLines.push(indent + nodeName);
  });
  var plainTextTree = textLines.join("\n");

  // 3. クリップボードAPIを使用して書き込み
  // モダンブラウザの標準機能（ClipboardItem）を使い、貼り付け先アプリに応じて形式を自動選択させます
  if (navigator.clipboard && window.ClipboardItem) {
    var blobText = new Blob([plainTextTree], { type: 'text/plain' });
    // もし他アプリがJSONとして明示的に受け取りたい場合に対応
    var blobJson = new Blob([jsonString], { type: 'text/json' }); // 安全のためプレーンテキストとして渡すのが確実

    var item = new ClipboardItem({
      'text/json': blobJson
      // 'text/plain': blobText
      // 他のWebアプリ等でJSONオブジェクトとしてそのままパースさせたい場合は、plainTextTree の代わりに jsonString のBlobを渡しても良いです
    });

    // ここでは最も汎用的な「テキストツリー（プレーンテキスト）」を優先して書き込みます
    // ※ JSONをそのまま渡したい場合は、下の行を `navigator.clipboard.writeText(jsonString)` に書き換えてください。
    navigator.clipboard.write([item]).then(function() {
      console.log("外部クリップボードにコピーしました（テキストツリー形式）");
    }).catch(function(err) {
      console.error("コピーに失敗しました:", err);
      // フォールバック
      fallbackCopyText(plainTextTree);
    });
  } else {
    // 古いブラウザ用のフォールバック
    fallbackCopyText(plainTextTree);
  }
}


/**
 * 従来の execCommand を使った簡易フォールバック
 */
function fallbackCopyText(text) {
  var textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    console.log("フォールバック機能でコピーしました");
  } catch (err) {
    console.error("フォールバックコピーも失敗しました", err);
  }
  document.body.removeChild(textArea);
}

/**
 * クリップボードにあるデータを、指定されたノードの子ノードとしてペーストする
 * @param {Object} targetNode - ペースト先となるD3のノードオブジェクト
 */
function paste_node(targetNode) {
  if (!clipboardData) {
    alert("クリップボードにコピーされたノードがありません。");
    return;
  }
  
  // ペーストするたびに新しい参照を作るため、再度ディープコピー
  var newDataRaw = structuredClone(clipboardData);

  // --- 1. 生データ (.data) のチルドレンに追加 ---
  if (!targetNode.data.children) {
    targetNode.data.children = [];
  }
  targetNode.data.children.push(newDataRaw);

  // --- 2. D3のノード構造 (.children) に新ノードとして追加 ---
  // 新しい生データから、D3の階層ノード（d3.hierarchy）を組み立てる
  var newNode = d3.hierarchy(newDataRaw);
  
  // 新しいノード配下すべての親参照（.parent）や深度（.depth）を正しくセットする
  newNode.descendants().forEach(function(n) {
    // 既存のツリー構造に合わせるため、親と深度を再計算
    if (n === newNode) {
      n.parent = targetNode;
      n.depth = targetNode.depth + 1;
    } else {
      // 子孫ノードたちの親参照と深度
      n.depth = n.parent.depth + 1;
    }

      d.descendants().forEach(function(node) {
        node.hasMoved = true;
        // 横型ツリーに合わせた座標更新（xに縦移動、yに横移動を加算）
        node.x += deltaY;
        node.y += deltaX;
        
        node.data.customX = node.x;
        node.data.customY = node.y;
      });

      // ★ 重要：すべてのノードの描画位置を、それぞれのデータの最新座標（customX/Y）で即時更新する
      g.selectAll(".node")
        .attr("transform", function(node) { 
          var currentX = node.data.customX !== undefined ? node.data.customX : node.x;
          var currentY = node.data.customY !== undefined ? node.data.customY : node.y;
          return "translate(" + currentY + "," + currentX + ")"; 
        });

      // ★ 重要：すべてのリンク（線）の位置を、それぞれの親・子の最新座標（customX/Y）で即時更新する
      g.selectAll(".link")
        .attr("d", function(l) {
          if (!l || !l.source || !l.target) return null;

          // 始点（親ノード側）は右端から伸ばすため、幅の半分を足す
          var rectW = l.source.rectW ? (l.source.rectW / 2) : 0;
          
          var sourceY = l.source.data.customY !== undefined ? l.source.data.customY + rectW : l.source.y + rectW; 
          var sourceX = l.source.data.customX !== undefined ? l.source.data.customX : l.source.x;

          var targetY = l.target.data.customY !== undefined ? l.target.data.customY : l.target.y;
          var targetX = l.target.data.customX !== undefined ? l.target.data.customX : l.target.x;

          var pathGenerator = d3.linkHorizontal()
            .x(function(p) { return p.yPos; })
            .y(function(p) { return p.xPos; });

          return pathGenerator({
            source: { yPos: sourceY, xPos: sourceX },
            target: { yPos: targetY, xPos: targetX }
          });
        });
    })
    .on("end", function(d) {
      d3.select(this).classed("dragging", false);
      
      // マウス透過設定を完全にクリアする
      d3.select(this).style("pointer-events", null)
                     .selectAll("*").style("pointer-events", null); 

      var targetElement = document.elementFromPoint(d3.event.sourceEvent.clientX, d3.event.sourceEvent.clientY);
      var targetNodeElement = targetElement ? targetElement.closest(".node") : null;

      var isDroppedOnNode = false;

      if (targetNodeElement && targetNodeElement !== this) {
        var targetData = d3.select(targetNodeElement).datum();
        var isTargetDescendant = d.descendants().includes(targetData);

        if (!isTargetDescendant) {
          // --- 1. 元の親から自分を削除 ---
          if (d.parent) {
            if (d.parent.data && d.parent.data.children) {
              var pIdx = d.parent.data.children.indexOf(d.data);
              if (pIdx > -1) d.parent.data.children.splice(pIdx, 1);
            }
            var index = d.parent.children.indexOf(d);
            if (index > -1) d.parent.children.splice(index, 1);
            if (d.parent.children.length === 0) d.parent.children = null;
          }

          // --- 2. 新しい親に自分を追加 ---
          if (targetData.data) {
            if (!targetData.data.children) targetData.data.children = [];
            targetData.data.children.push(d.data);
          }
          if (!targetData.children) targetData.children = [];
          targetData.children.push(d);
          
          d.parent = targetData; 
          isDroppedOnNode = true; 
        }
      }

      // ★ 条件分岐: 他のノードにドロップされた場合のみ「元の位置」に戻す
      if (isDroppedOnNode) {
        d.descendants().forEach(function(node) {
          var key = node.id || node.data.id || JSON.stringify(node.data.name);
          var original = originCoordinates[key];
          if (original) {
            node.x = original.x;
            node.y = original.y;
            node.data.customX = original.customX;
            node.data.customY = original.customY;
          }
        });
      } else {
        // 白地にドロップされた場合は、移動させた親の相対的な移動量を子孫にも伝填させるため、
        // 子孫ノード全体の customX / customY をここで一括確定させます
        var deltaX_final = d.x - originCoordinates[d.id || d.data.id || JSON.stringify(d.data.name)].x;
        var deltaY_final = d.y - originCoordinates[d.id || d.data.id || JSON.stringify(d.data.name)].y;
        
        d.descendants().forEach(function(node) {
          if (node !== d) {
            node.x += deltaX_final;
            node.y += deltaY_final;
            node.data.customX = node.x;
            node.data.customY = node.y;
          }
        });
      }

      update(root); 
    });

// リンク update (正しい位置へアニメーション。親の右端から、子の左端へつなぐ)
var linkUpdate = linkEnter.merge(link);

linkUpdate
  .transition()
  .duration(duration)
  // ★ 修正: ジェネレーターではなく、各データごとに実行される関数を定義する
  .attr("d", function(d) {
    if (!d.source || !d.target) return null;

    // 座標の安全な取得
    var sY = d.source.y !== undefined ? d.source.y : 0;
    var sX = d.source.x !== undefined ? d.source.x : 0;
    var tY = d.target.y !== undefined ? d.target.y : 0;
    var tX = d.target.x !== undefined ? d.target.x : 0;

    // 四角形の幅の半分（d.source.rectW / 2）を足して右端から線を伸ばす
    // (お使いの四角形 rect の幅設定に合わせて調整してください)
    var sourceRectW = d.source.rectW ? (d.source.rectW ) : 0;

    // D3に独自のオブジェクト構造を認識させるためのパスジェネレーターを作成
    var pathGenerator = d3.linkHorizontal()
      .x(function(p) { return p.yPos; }) // 横軸にyPosをマッピング
      .y(function(p) { return p.xPos; }); // 縦軸にxPosをマッピング

    // 始点と終点を独自オブジェクトの形式で食わせて、pathの文字列（M... C...）を生成
    return pathGenerator({
      source: { yPos: sY + sourceRectW, xPos: sX },
      target: { yPos: tY, xPos: tX }
    });
  });

    // .target(function(d) { return [source.y + d.source.rectW, source.x]; })
    .target(function(d) { return [target.y, target.x]; })
  )
