<!DOCTYPE html>
<!-- https://wizardace.com/d3-collapsible-tree/ -->
<html>

<head>
  <meta charset="utf-8">
  <title>leafree</title>
  <style>
    .node .node-name {
        font-size: 11px;
        fill: #666;
        font-weight: bold;
        text-anchor: left;
    }

    .node .node-disp {
        font-size: 14px;
        fill: #000;
        text-anchor: end;
        dominant-baseline: central; /* 縦方向中央揃え */
    }

    .node .node-expr {
        font-size: 10px;
        fill: #555;
        font-weight: italic;
        text-anchor: left;
    }

    .link {
        fill: none;
        stroke: #555;
        stroke-opacity: 0.6;
        stroke-width: 2.0px;
    }

  </style>
</head>

<body>
    <div id="controls">
        <!-- ボタンなど -->
    </div>

    <div id="context-menu" style="display: none; position: absolute; background: white; border: 1px solid #ccc; z-index: 10;">
        <!-- メニュー -->
        <ul>
            <li id="menu-item-child" style="list-style: none; padding: 8px 16px; cursor: pointer;">子ノード挿入</li>
            <li id="menu-item-copy" style="list-style: none; padding: 8px 16px; cursor: pointer;">コピー</li>
            <li id="menu-item-paste" style="list-style: none; padding: 8px 16px; cursor: pointer;">子としてペースト</li>
            <li id="menu-item-rename" style="list-style: none; padding: 8px 16px; cursor: pointer;">ノード名変更</li>
            <li id="menu-item-reexpr" style="list-style: none; padding: 8px 16px; cursor: pointer;">式変更</li>
            <li id="menu-item-delete" style="list-style: none; padding: 8px 16px; cursor: pointer;">削除</li>
        </ul>
    </div>

    <svg width="1800" height="3000"> <!--不要かも--></svg>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/mathjs"></script>

    <script src="leafree_tree.js"></script>

<script>

const node_size_x = 60;
const node_size_y = 14;

const node_menu = d3.select("#context-menu");

// var data_tree = {

var data_tree = {
    "name": "root",
    "children": [
        {
            "name" : "A",
            "expr" : -1,
            "children" : [
                {
                    "name" : "A",
                    "expr" : 0
                },
                {
                    "name" : "B",
                    "expr" : "='A'",
                    "children" : [

const xExtent = d3.extent(nodes, d => d.x); // [最左のx, 最右のx]
const yExtent = d3.extent(nodes, d => d.y); // [最上のy, 最下のy]（最上は通常0）

    .attr("refY", 0)
    .attr("markerWidth", 10)    // マーカーの大きさ
    .attr("markerHeight", 10)
    .attr("orient", "auto")    // 線の傾きに合わせて自動回転
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")

                    x: node.x,
                    y: node.y,
                    customX: node.data.customX,
                    customY: node.data.customY
                };
            });
        })
    .on("drag", function(d) {
        d.hasMoved = true;
        var deltaX = d3.event.dx; 
        var deltaY = d3.event.dy;
        console.log("drag", deltaX, deltaY);
        d.descendants().forEach(function(node) {
            node.hasMoved = true;
            // 横型ツリーに合わせた座標更新（xに縦移動、yに横移動を加算）
            node.x += deltaY;
            node.y += deltaX;
            node.data.customX = node.x;
            node.data.customY = node.y;
        });
        g.selectAll(".node")
            .attr("transform", function(node) { 
                var currentX = node.data.customX !== undefined ? node.data.customX : node.x;
                var currentY = node.data.customY !== undefined ? node.data.customY : node.y;
                return "translate(" + currentY + "," + currentX + ")"; 
                });
        // ★ 重要：すべてのリンク（線）の位置を、それぞれの親・子の最新座標（customX/Y）で即時更新する
        g.selectAll(".link")
            .attr("d", function(l) {
                if (!l || !l.source || !l.target) return null;
                var rectW = l.source.rectW?l.source.rectW:node_size_x;
                var sourceY = l.source.data.customY !== undefined ? l.source.data.customY + rectW : l.source.y + rectW; 
                var sourceX = l.source.data.customX !== undefined ? l.source.data.customX : l.source.x;
                var targetY = l.target.data.customY !== undefined ? l.target.data.customY : l.target.y;
                var targetX = l.target.data.customX !== undefined ? l.target.data.customX : l.target.x;
                var pathGenerator = d3.linkHorizontal()
                    .x(function(p) { return p.yPos; })
                    .y(function(p) { return p.xPos; });
                return pathGenerator({
                    source: { yPos: sourceY, xPos: sourceX },
                    target: { yPos: targetY, xPos: targetX }
                });
            });

                    node.data.customX = node.x;
                    node.data.customY = node.y;
                }

            var deltaY_final = d.y - originCoordinates[d.id /*|| d.data.id || JSON.stringify(d.data.name)*/].y;
            d.data.customX = d.x;
            d.data.customY = d.y;
            
            d.descendants().forEach(function(node) {
            if (node !== d) {
                node.x = originCoordinates[node.id].x + deltaX_final;
                node.y = originCoordinates[node.id].y + deltaY_final;
                node.data.customX = node.x;
                node.data.customY = node.y;
            }
            });
            resize();
        }
        console.log(d);
        self.style('pointer-events', null);
        update(root, data_relation); 
    });

    //     .attr("y2", function(target) {
    //         return target.ref.x - target.parent.x /*+ target.ref.rctW/2 - target.parent.rectW/2*/;
    //     })
    //     .attr("x2", function(target) {
    //         return target.ref.y - target.parent.y;
    //     })
    //     .attr("stroke", "#222")
    //     .attr("stroke-width", 1)
    //     .attr("stroke-dasharray", "1 1")
    //     .attr("marker-end", "url(#arrow)");

    nodeUpdate.select("rect")
        .attr("width", function(d) { return d.rectW?d.rectW:node_size_x; })
        .attr("height", function(d) { return d.rectH?d.rectH:node_size_y; })
        .attr("x", 0)       // 左端を揃える
        .attr("y",  function(d) { return -(d.rectH?d.rectH:node_size_y) / 2; })
        .style("fill", function(d) { return "#ddd"; })
        .style("stroke", "#111")
        .style("stroke-width", "1px")
        ;
    nodeUpdate.select(".node-name")
        .transition()
        .duration(duration)
        .style("fill-opacity", 1);
    nodeUpdate.select(".node-disp")
        .transition()
        .duration(duration)
        .text(function(d) { return d.data.disp; })
        .style("fill-opacity", 1);
    nodeUpdate.select(".node-expr")
        .transition()
        .duration(duration)
        .style("fill-opacity", 1);

    nodeUpdate.call(drag);


    var nodeExit = node
        .exit()
        .transition()
        .duration(duration)
        .attr("transform", function(d) { return "translate(" + root.y + "," + root.x + ")"; })
        .remove();
    // var relExit = relation
    //     .exit()
    //     .transition()
    //     .duration(duration)
    //     .attr("transform", function(d) { return "translate(" + d[0].y + "," + d[0].x + ")"; })
    //     .remove();
    // console.log("after relExit");


    // relExit.select(".ref-link")
    //     .style("fill-opacity", function(d) { console.log("relExit", d); return 1e-6;});
    nodeExit.select("rect")
        .style("fill-opacity", function(d) { console.log("nodeExit", d); return 1e-6;});
    nodeExit.select(".node-name")
        .style("fill-opacity", 1e-6);
    nodeExit.select(".node-disp")
        .style("fill-opacity", 1e-6);
    nodeExit.select(".node-expr")
        .style("fill-opacity", 1e-6);
    console.log("before relExit select");


    var linkEnter = link.enter().insert('path', "g")
      .attr("class", "link");

    linkEnter.attr("d", function(d) {
        if (!d.source || !d.target) {
            console.log("データが不正です: sourceまたはtargetがありません");
            return null;
        }
        var sY = (!isNaN(d.source.y)) ? d.source.y : 0;
        var sX = (!isNaN(d.source.x)) ? d.source.x : 0;
        var tY = (!isNaN(d.target.y)) ? d.target.y : 0;
        var tX = (!isNaN(d.target.x)) ? d.target.x : 0;
        var sourceRectW = d.source.rectW ? (d.source.rectW) : 0;
        var pathGenerator = d3.linkHorizontal()
            .x(function(p) { return p.yPos; })
            .y(function(p) { return p.xPos; });
        // console.log(d.source);
        // console.log(sY, sourceRectW);
        return pathGenerator({
            source: { yPos: sY + sourceRectW, xPos: sX },
            target: { yPos: tY, xPos: tX }
        });
    });

// console.log("linkUpdate")

// // リンク update (正しい位置へアニメーション。親の右端から、子の左端へつなぐ)
    var linkUpdate = linkEnter.merge(link);

    linkUpdate
        .transition()
        .duration(duration)
        .attr("d", function(d) {
            if (!d.source || !d.target) return null;
            var sY = d.source.y !== undefined ? d.source.y : 0;
            var sX = d.source.x !== undefined ? d.source.x : 0;
            var tY = d.target.y !== undefined ? d.target.y : 0;
            var tX = d.target.x !== undefined ? d.target.x : 0;
            var sourceRectW = d.source.rectW ? (d.source.rectW ) : node_size_x;
            var pathGenerator = d3.linkHorizontal()
                .x(function(p) { return p.yPos; }) // 横軸にyPosをマッピング
                .y(function(p) { return p.xPos; }); // 縦軸にxPosをマッピング
            return pathGenerator({
                source: { yPos: sY + sourceRectW, xPos: sX },
                target: { yPos: tY, xPos: tX }
            });
        });

//   console.log("link.exit")

// // リンク exit (親の現在の位置に縮んで消える)
    link
        .exit()
        .transition()
        .duration(duration)
        .attr("d", d3.linkHorizontal()
            // 消え去るときは、親の現在の位置（source.y, source.x）に向かって縮ませる
            .source(function(d) { 
                console.log(d.source.data.name);
                console.log("rectW2", d.source.rectW)
                return [source.y + d.source.rectW, source.x]; })
            // .target(function(d) { return [source.y + d.source.rectW, source.x]; })
            .target(function(d) { return [target.y, target.x]; })
        )
        .remove();
    console.log("before update");


}

function resize() {
    const nodes = root.descendants();
    const xExtent = d3.extent(nodes, d => d.data.customX?d.data.customX:d.x); // [最左のx, 最右のx]
    const yExtent = d3.extent(nodes, d => d.data.customY?d.data.customY:d.y); // [最上のy, 最下のy]（最上は通常0）
    // console.log(xExtent, yExtent);
    // 3. 余白（マージン）の設定
    const margin = { top: 40, right: 40, bottom: 40, left: 40 };

    const svgWidth = Math.max((yExtent[1]) + margin.left + margin.right + node_size_x*2,800);
    const svgHeight = Math.max((xExtent[1]) + margin.top + margin.bottom + node_size_y*5,900);
    // console.log(svgWidth, svgHeight);

    // 5. SVG要素にサイズを適用
    d3.select("svg")
        .attr("width", svgWidth)
        .attr("height", svgHeight);
}


function create_relation() {
    data_relation_set.clear();
    root.descendants()
        .forEach(d => {
            d.link_src_set
                .forEach(link_src => {
                    data_relation_set.add([d, link_src]);
                })
        })
    console.log(data_relation_set);
    data_relation = Array.from(data_relation_set);
    console.log(data_relation);
}
</script>
