        d.hasMoved = true;

        // console.log("drag", deltaX, deltaY);
        d.descendants().forEach(function(node) {
            node.hasMoved = true;
            // 横型ツリーに合わせた座標更新（xに縦移動、yに横移動を加算）
            node.x += deltaY;

                var sourceY = l.source.data.customY !== undefined ? l.source.data.customY + rectW : l.source.y + rectW; 
                var sourceX = l.source.data.customX !== undefined ? l.source.data.customX : l.source.x;
                var targetY = l.target.data.customY !== undefined ? l.target.data.customY : l.target.y;
                var targetX = l.target.data.customX !== undefined ? l.target.data.customX : l.target.x;
                var pathGenerator = d3.linkHorizontal()
                    .x(function(p) { return p.yPos; })
                    .y(function(p) { return p.xPos; });
                return pathGenerator({
                    source: { yPos: sourceY, xPos: sourceX },
                    target: { yPos: targetY, xPos: targetX }
                });
            });
        g.selectAll(".relation")
            .attr("x1", function(l) {
                var sx = l[0].data.customY !== undefined ? l[0].data.customY : l[0].y;
                var w  = l[0].data.rectW || node_size_x;
                // console.log("x1", sx +w/2);
                return sx + w / 2;
            })
            .attr("y1", function(l) {

                var h  = l[0].data.rectH || node_size_y;

                return sy + h / 2;
            })

    .on("end", function(d) {
        var self = d3.select(this)

        // var self = d3.select(d)

        var targetNodeElement = targetElement ? targetElement.closest(".node") : null;

        if (targetNodeElement && targetNodeElement !== d
                && targetNodeElement !== d.parent) {
            // console.log("AAAA");

            var targetData = d3.select(targetNodeElement).datum();
            var isTargetDescendant = d.descendants().includes(targetData);

            if (!isTargetDescendant) {
                // --- 1. 元の親から自分を削除 ---
                // console.log("BBBB");
                if (d.parent) {
                    if (d.parent.data && d.parent.data.children) {
                        var pIdx = d.parent.data.children.indexOf(d.data);
                        if (pIdx > -1) d.parent.data.children.splice(pIdx, 1);
                    }
                    var index = d.parent.children.indexOf(d);
                    if (index > -1) d.parent.children.splice(index, 1);
                    if (d.parent.children.length === 0) d.parent.children = null;
                }

                // --- 2. 新しい親に自分を追加 ---
                if (targetData.data) {
                    if (!targetData.data.children) targetData.data.children = [];
                    targetData.data.children.push(d.data);
                }
                if (!targetData.children) targetData.children = [];
                targetData.children.push(d);
                
                d.parent = targetData; 
                changeParent(d, targetData);
                create_relation();

                isDroppedOnNode = true; 
            }
        }

        // ★ 条件分岐: 他のノードにドロップされた場合のみ「元の位置」に戻す
        //    うまく、機能していないようだ
        if (isDroppedOnNode) {
            d.descendants().forEach(function(node) {
                var key = node.id; // || node.data.id || JSON.stringify(node.data.name);
                var original = originCoordinates[key];
                // console.log(key, original);
                if (original) {
                    // console.log(node.x, node.y, node.data.customX, node.data.customY);
                    node.x = original.x;
                    node.y = original.y;
                    // node.data.customX = original.customX;
                    // node.data.customY = original.customY;
                    node.data.customX = node.x;
                    node.data.customY = node.y;
                }
            });
        } else {
            // 白地にドロップされた場合は、移動させた親の相対的な移動量を子孫にも伝填させるため、
            // 子孫ノード全体の customX / customY をここで一括確定させます
            var deltaX_final = d.x - originCoordinates[d.id /*|| d.data.id || JSON.stringify(d.data.name)*/].x;
            var deltaY_final = d.y - originCoordinates[d.id /*|| d.data.id || JSON.stringify(d.data.name)*/].y;
            d.data.customX = d.x;
            d.data.customY = d.y;
            
            d.descendants().forEach(function(node) {
            if (node !== d) {
                node.x = originCoordinates[node.id].x + deltaX_final;
                node.y = originCoordinates[node.id].y + deltaY_final;
                node.data.customX = node.x;
                node.data.customY = node.y;
            }
            });
            resize();
        }
        // console.log(d);
        self.style('pointer-events', null);
        update(root, data_relation); 
    });

function cloneTreeData(data) {
    return structuredClone(data);
}

function reassignIds(node) {
    node.id = ++nodeCounter;

    if (node.children && Array.isArray(node.children)) {
        node.children.forEach(reassignIds);
    }
    return node;
}

function update(root, data_relation) {
    root.descendants().forEach(function(d) {
        if (!d.id) d.id = ++nodeCounter;
    });

    var positions = {};
    root.descendants().forEach(function(d) {
        if (d.data.customX !== undefined && d.data.customY !== undefined) {
        positions[d.id] = { x: d.data.customX, y: d.data.customY };
        }
    });
    // tree レイアウト位置を計算
    tree(root);

    // 子、孫方向の位置設定
    // root.each(function(d) { d.y = d.depth * 320; });
    // 手動移動したノードは固定位置を適用、それ以外は初期位置を計算
    root.each(function(d) {
        if (positions[d.id]) {
        d.x = positions[d.id].x;
        d.y = positions[d.id].y;
        }
    });
    // console.log("root", root);

    var node = g.selectAll('.node')
        .data(root.descendants(), function(d) { return d.id });
    var link = g.selectAll(".link")
        .data(root.links(), function(d) { return d.target.id; });
    var relation = g.selectAll('.relation')
        .data(data_relation, function(d) { return d[0].id + "-" + d[1].id;});

    // console.log("node", node);
    // console.log("relation", relation);

    var nodeEnter = node
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", function(d) { return "translate(" + nodePosX(d) + "," + nodePosY(d) + ")"; })
        .call(drag)
        ;

        // 1. relationのデータバインド（バグを防ぐため明示的に文字列を返す）
    var relation = g.selectAll('.relation')
        .data(data_relation, function(d) { 
            return d[0].id + "-" + d[1].id; 
        });

    // 2. enter, update, exit の一括処理（.joinを使用）
    var relationLines = relation.join(
        enter => {
            // 新しく追加されたリレーション（線）
            return enter.append("line")
                .attr("class", "relation")
                .attr("stroke", "#222") // リレーションとリンクを区別する色
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "1 1")

        if (!d.source || !d.target) {
            console.log("データが不正です: sourceまたはtargetがありません");
            return null;
        }
        var sY = (!isNaN(d.source.y)) ? d.source.y : 0;
        var sX = (!isNaN(d.source.x)) ? d.source.x : 0;
        var tY = (!isNaN(d.target.y)) ? d.target.y : 0;
        var tX = (!isNaN(d.target.x)) ? d.target.x : 0;
        var sourceRectW = d.source.rectW ? (d.source.rectW) : 0;
        var pathGenerator = d3.linkHorizontal()
            .x(function(p) { return p.yPos; })
            .y(function(p) { return p.xPos; });
        // console.log(d.source);
        // console.log(sY, sourceRectW);
        return pathGenerator({
            source: { yPos: sY + sourceRectW, xPos: sX },
            target: { yPos: tY, xPos: tX }
        });
    });

// console.log("linkUpdate")

// // リンク update (正しい位置へアニメーション。親の右端から、子の左端へつなぐ)
    var linkUpdate = linkEnter.merge(link);

    linkUpdate
        .transition()
        .duration(duration)
        .attr("d", function(d) {
            if (!d.source || !d.target) return null;
            var sY = d.source.y !== undefined ? d.source.y : 0;
            var sX = d.source.x !== undefined ? d.source.x : 0;
            var tY = d.target.y !== undefined ? d.target.y : 0;
            var tX = d.target.x !== undefined ? d.target.x : 0;
            var sourceRectW = d.source.rectW ? (d.source.rectW ) : node_size_x;
            var pathGenerator = d3.linkHorizontal()
                .x(function(p) { return p.yPos; }) // 横軸にyPosをマッピング
                .y(function(p) { return p.xPos; }); // 縦軸にxPosをマッピング
            return pathGenerator({
                source: { yPos: sY + sourceRectW, xPos: sX },
                target: { yPos: tY, xPos: tX }
            });
        });

//   console.log("link.exit")

// // リンク exit (親の現在の位置に縮んで消える)
    link
        .exit()
        .transition()
        .duration(duration)
        .attr("d", d3.linkHorizontal()
            // 消え去るときは、親の現在の位置（source.y, source.x）に向かって縮ませる
            .source(function(d) { 
                console.log(d.source.data.name);
                // console.log("rectW2", d.source.rectW)
                return [d.source.y + d.source.rectW, d.source.x]; })
            // .target(function(d) { return [source.y + d.source.rectW, source.x]; })
            .target(function(d) { return [d.target.y, d.target.x]; })
        )
        .remove();
    // console.log("before update");


}


function delete_node(node) {
    const num_child = node.descendants().length - 1;
    if (num_child !== 0) {
        message = "子孫ノード " + num_child + " 個含めて削除する(OK)か、削除中止する(キャンセル)か";
        var result = confirm(message);
        if (! result) {
            return;
        }
    }
    if (! node.parent) {
        alert("ルートノードは削除できません。");
        return;
    }

    deleteNode(node);

    data_relation = [];
    create_relation();
    update(root, data_relation);
}

    newData = {

function resize() {
    const nodes = root.descendants();
    const xExtent = d3.extent(nodes, d => d.data.customX?d.data.customX:d.x); // [最左のx, 最右のx]
    const yExtent = d3.extent(nodes, d => d.data.customY?d.data.customY:d.y); // [最上のy, 最下のy]（最上は通常0）
    // console.log(xExtent, yExtent);
    // 3. 余白（マージン）の設定
    const margin = { top: 40, right: 40, bottom: 40, left: 40 };

    const svgWidth = Math.max((yExtent[1]) + margin.left + margin.right + node_size_x*2,800);
    const svgHeight = Math.max((xExtent[1]) + margin.top + margin.bottom + node_size_y*5,900);
    // console.log(svgWidth, svgHeight);

    // 5. SVG要素にサイズを適用
    d3.select("svg")
        .attr("width", svgWidth)
        .attr("height", svgHeight);
}


function create_relation() {
    data_relation_set.clear();
    // console.log(root);
    root.descendants()
        .forEach(d => {
            if (d.link_src_set) {
                d.link_src_set
                    .forEach(link_src => {
                        data_relation_set.add([d, link_src]);
                    })
            }
        })
    // console.log(data_relation_set);
    data_relation = Array.from(data_relation_set);
    // console.log(data_relation);
}


async function saveDataToFile( data, loadFileName ) {
  try {
    // 1. 「名前を付けて保存」ダイアログを表示
    const handle = await window.showSaveFilePicker({
      suggestedName: loadFileName?loadFileName:'my-d3-data.json',
      types: [{
        description: 'JSON Files',
        accept: { 'application/json': ['.json'] } // 拡張子の制限
      }]
    });

    // 2. データを文字列に変換して書き込み
    const writable = await handle.createWritable();
    const jsonString = JSON.stringify(data, null, 2);
    await writable.write(jsonString);
    await writable.close();
  } catch (err) {
    // ユーザーがキャンセルした場合はここにきます
    console.log('保存がキャンセルされました:', err);
  }
}

function setNode(root) {
    root.descendants()
        .forEach( d => {
            if (!d.id) d.id = ++nodeCounter;
            d.link_ref_set = d.link_ref_set ?? new Set();
            d.link_src_set = d.link_src_set ?? new Set();
            // 横幅など？
            // console.log(d.data.name, d.data.rectW);
            d.rectW = d.data.rectW ? d.data.rectW : Math.max(getTextWidth(d.data.disp, null), node_size_x) + 5 + 5; 
            // console.log(d.data.name, d.rectW);
        })
}

// --- 2. 文字列の幅（ピクセル数）を正確に測定するヘルパー関数 ---
function getTextWidth(text, font) {
    var canvas = document.createElement('canvas');
    var context = canvas.getContext('2d');
    context.font = font || '14px sans-serif';
    var metrics = context.measureText(text);
    return metrics.width;
}

function nodePosX(d) {
    return d.data.customY !== undefined ? d.data.customY : d.y;
}

function nodePosY(d) {
    return d.data.customX !== undefined ? d.data.customX : d.x;
}

function print_root(root) {
    console.log("print_root",
        root.descendants().map(d => ({
            name: d.data.name,
            depth: d.depth,
            x: d.x,
            y: d.y,
            id : d.id,
            link_ref_set : d.link_ref_set,
            customX : d.data.customX,
            customY : d.data.customY
        }))
        );

}
