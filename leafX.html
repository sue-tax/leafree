            });

    .on("drag", function(d) {
        d.hasMoved = true;

        var deltaY = d3.event.dy;
        // console.log("drag", deltaX, deltaY);
        d.descendants().forEach(function(node) {
            node.hasMoved = true;

                return "translate(" + nodePosX(node) + "," + nodePosY(node) + ")"; 
                });
        // ★ 重要：すべてのリンク（線）の位置を、それぞれの親・子の最新座標（customX/Y）で即時更新する
        g.selectAll(".link")
            .attr("d", function(l) {
                if (!l || !l.source || !l.target) return null;
                var rectW = l.source.w; //?l.source.w:node_size_x;
                // var sourceY = l.source.data.customY !== undefined ? l.source.data.customY + rectW : l.source.y + rectW; 
                // var sourceX = l.source.data.customX !== undefined ? l.source.data.customX : l.source.x;

                // var targetX = l.target.data.customX !== undefined ? l.target.data.customX : l.target.x;
                var sourceY = getNodeCustomY(l.source) !== undefined ? getNodeCustomY(l.source) + rectW : l.source.y + rectW; 
                var sourceX = getNodeCustomX(l.source) !== undefined ? getNodeCustomX(l.source) : l.source.x;
                var targetY = getNodeCustomY(l.target) !== undefined ? getNodeCustomY(l.target): l.target.y;
                var targetX = getNodeCustomX(l.target) !== undefined ? getNodeCustomX(l.target) : l.target.x;
                var pathGenerator = d3.linkHorizontal()
                    .x(function(p) { return p.yPos; })
                    .y(function(p) { return p.xPos; });
                return pathGenerator({
                    source: { yPos: sourceY, xPos: sourceX },
                    target: { yPos: targetY, xPos: targetX }
                });
            });
        g.selectAll(".relation")

                var h  = l[0].h;

                return sy + h / 2;
            })
            .attr("x2", function(l) {
                var tx = getNodeCustomY(l[1]) !== undefined ? getNodeCustomY(l[1]) : l[1].y;
                var w  = l[1].w; // || node_size_x;
                return tx; // - l[0].y
            })
            .attr("y2", function(l) {
                var ty = getNodeCustomX(l[1]) !== undefined ? getNodeCustomX(l[1]) : l[1].x;
                // var h  = l[1].data.rectH || node_size_y;

            })

    .on("end", function(d) {
        var self = d3.select(this)

        var targetNodeElement = targetElement ? targetElement.closest(".node") : null;
        var isDroppedOnNode = false;

        // if (targetNodeElement && targetNodeElement !== d
        //         && targetNodeElement !== d.parent) {
        //     // console.log("AAAA");

        //     var targetData = d3.select(targetNodeElement).datum();
        if (targetNodeElement) {
            var targetData = d3.select(targetNodeElement).datum();

            if (targetData !== d && targetData !== d.parent) {
                var isTargetDescendant = d.descendants().includes(targetData);

                if (!isTargetDescendant) {
                    // --- 1. 元の親から自分を削除 ---
                    // console.log("BBBB");
                    if (d.parent) {
                        // if (d.parent.data && d.parent.data.children) {
                        //     var pIdx = d.parent.data.children.indexOf(d.data);
                        //     if (pIdx > -1) d.parent.data.children.splice(pIdx, 1);
                        // }
                        if (d.parent && d.parent.data && d.parent.data.contains(d.data)) {
                                d.parent.data.removeChild(d.data);
                        }
                        if (d.parent && d.parent.children) {
                            var index = d.parent.children.indexOf(d);
                            if (index > -1) d.parent.children.splice(index, 1);
                            if (d.parent.children.length === 0) d.parent.children = null;
                        }
                    }

                    const checkNodeName = checkDuplicateNodeName(targetData, getNodeName(d));
                    if (! checkNodeName) {
                        const renameName = renameDuplicateNodeName(targetData, getNodeName(d));
                        console.log(renameName);
                        setNodeName(d, renameName);
                    }
                    // --- 2. 新しい親に自分を追加 ---
                    // if (targetData.data) {
                    //     if (!targetData.data.children) targetData.data.children = [];
                    //     targetData.data.children.push(d.data);
                    // }
                    if (targetData.data) {
                        targetData.data.appendChild(d.data);
                    }
                    if (!targetData.children) targetData.children = [];
                    targetData.children.push(d);
                    
                    d.parent = targetData; 
                    changeParent(d, targetData);
                    create_relation();

                    isDroppedOnNode = true; 
                }
            }
        }

        // ★ 条件分岐: 他のノードにドロップされた場合のみ「元の位置」に戻す
        //    うまく、機能していないようだ
        if (isDroppedOnNode) {
            d.descendants().forEach(function(node) {
                var key = node.id; // || node.data.id || JSON.stringify(node.data.name);
                var original = originCoordinates[key];
                // console.log(key, original);
                if (original) {
                    // console.log(node.x, node.y, node.data.customX, node.data.customY);
                    node.x = original.x;
                    node.y = original.y;
                    setNodeCustomX(node, node.x);
                    setNodeCustomY(node, node.y);
                    // node.data.customX = node.x;
                    // node.data.customY = node.y;
                }
            });
        } else {
            // 白地にドロップされた場合は、移動させた親の相対的な移動量を子孫にも伝填させるため、
            // 子孫ノード全体の customX / customY をここで一括確定させます
            var deltaX_final = d.x - originCoordinates[d.id].x;
            var deltaY_final = d.y - originCoordinates[d.id].y;
            setNodeCustomX(d, d.x);
            setNodeCustomY(d, d.y);
            // d.data.customX = d.x;
            // d.data.customY = d.y;
            
            d.descendants().forEach(function(node) {
            if (node !== d) {
                node.x = originCoordinates[node.id].x + deltaX_final;
                node.y = originCoordinates[node.id].y + deltaY_final;
                setNodeCustomX(node, node.x);
                setNodeCustomY(node, node.y);
                // node.data.customX = node.x;
                // node.data.customY = node.y;
            }
            });
            resize();
        }
        // console.log(d);
        self.style('pointer-events', null);
        update(root, data_relation); 
    });

function cloneTreeData(data) {
    return structuredClone(data);
}

function reassignIds(node) {
    node.id = ++nodeCounter;

    if (node.children && Array.isArray(node.children)) {
        node.children.forEach(reassignIds);
    }
    return node;
}

function copy_node(d) {
    clipboardNode = cloneTreeData(d.data);
    clipboardParentNode = d.parent;
    console.log("copied", clipboardNode);
}

function paste_node(d) {
    if (!clipboardNode) return;
    const old_parentX = clipboardParentNode.x;
    const old_parentY = clipboardParentNode.y;

    console.log(clipboardNode);
    const newNode = reassignIds(cloneTreeData(clipboardNode));
    console.log(newNode);
    let name = newNode.name;

    if (!d.data.children) {
        d.data.children = [];
    }
    const flag = checkDuplicateNodeName(d, name);
    if (! flag) {
        name_plus = renameDuplicateNodeName(parent, name);
        newNode.name = name_plus;
    }
    d.data.children.push(newNode);

    // const rootID = root.id;
    const parentID = d.id;
    root = d3.hierarchy(root.data);
    tree(root);
    root.descendants()

function delete_node(node) {
    if (! node.parent) {
        alert("ルートノードは削除できません。");
        return;
    }
    const num_child = node.descendants().length - 1;
    if (num_child !== 0) {
        message = "子孫ノード " + num_child + " 個含めて削除する(OK)か、削除中止する(キャンセル)か";
        var result = confirm(message);
        if (! result) {
            return;
        }
    }
    deleteNode(node);
    console.log(node);
    console.log(node.parent);
    cleanupEmptyChildren(node.parent);
    // cleanupEmptyChildren(root.data ? root.data : root);
    // print_root(root);
    data_relation = [];
    create_relation();
    console.log("after create_relation" ,data_relation);
    update(root, data_relation);
}


function cleanupEmptyChildren(dataNode) {
    console.log("cleanupEmptyChildren", dataNode);
    if (dataNode.children && dataNode.children.length === 0) {
        delete dataNode.children;
    }
    if (dataNode.children) {
        console.log(dataNode.children);
        dataNode.children.forEach(child => cleanupEmptyChildren(child));
    }
}

function addChildToRootAtPosition(name, expr, posX, posY) {
    if (!root.data.children) {
        root.data.children = [];

        const flag = checkDuplicateNodeName(parentNode, name);
        if (! flag) {
            alert("ノード名が重複しています");
            return;
        } 
    }
    let set_expr = expr;
    if (typeof expr === "string") {
        if (expr.trim() !== "") {
            if (Number.isFinite(Number(expr))) {
                set_expr = Number(expr);
            }
        }
    }
    console.log("set_expr", set_expr);
    console.log(typeof set_expr);

    const newData = {
        name: name,
        expr: set_expr,
        children: [],
        id: ++nodeCounter,
        customX: posY,
        customY: posX
    };

    root.data.children.push(newData);
    const rootID = root.id;
    root = d3.hierarchy(root.data);
    root.descendants()
        .forEach(d => {d.id = d.data.id;})
    // const newParentNode = root.descendants().find( function(node) { return node.id === parentID; });
    const newNode = root.children.find( function(node) { return node.data.name === name; });
    setNode(root);

    new_Node(newNode, name, set_expr);
    setNode(root);
    data_relation = [];
    create_relation();
    update(root, data_relation);
}

async function saveDataToXML( data, loadFileName ) {
  try {
    // 1. 「名前を付けて保存」ダイアログを表示
    const handle = await window.showSaveFilePicker({
      suggestedName: loadFileName?loadFileName:'leafX_.xml',
      types: [{
        description: 'XML Files',
        accept: { 'application/xml': ['.xml'] } // 拡張子の制限
      }]
    });
    const writable = await handle.createWritable();
    const serializer = new XMLSerializer();
    let xmlString = serializer.serializeToString(data);
    if (!xmlString.startsWith("<?xml")) {
      xmlString = '<?xml version="1.0" encoding="UTF-8"?>\n' + xmlString;
    }
    await writable.write(xmlString);
    await writable.close();
  } catch (err) {
    // ユーザーがキャンセルした場合はここにきます
    console.log('保存がキャンセルされました:', err);
  }
}


async function loadXMLToData() {
    try {
        const load_options = {
            id: "leafree-load",
            types: [{
                description: "XMLファイル",
                accept: {
                    "application/xml": [".xml"],
                    "text/xml": [".xml"]
                }
            }],
            excludeAcceptAllOption: false,
            multiple: false
        };
        const [handle] = await window.showOpenFilePicker(load_options);
        const file = await handle.getFile();
        const text = await file.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "application/xml");
        if (xmlDoc.querySelector("parsererror")) {
            console.error("XMLのパースに失敗しました");
            return null;
        }
        return xmlDoc;
    } catch (err) {
        console.log("ロードが失敗しました:", err);
        return null;
    }
}

function getTextSize(text, font_family, font_size) {
    textMeasureContext.font = font_size + " " + font_family;
    const metrics = textMeasureContext.measureText(text);
    const width = metrics.width;
    let height =
        (metrics.actualBoundingBoxAscent || 0) +
        (metrics.actualBoundingBoxDescent || 0);
    if (!height) {
        height = parseFloat(font_size) || 16;
    }
    return { width, height };
}


function nodePosX(d) {
    const customY = getNodeCustomY(d);

function nodePosY(d) {
    const customX = getNodeCustomX(d);
    return customX !== undefined ? customX : d.x;
}
